name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: "01234567890123456789012345678901"
      NEXTAUTH_SECRET: "01234567890123456789012345678901"
      PAYMENT_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      STONE_WEBHOOK_SECRET: "ci-stone-webhook-16"
      WEBHOOK_INGEST_SECRET: "ci-webhook-ingest16"
      CRON_SECRET: "ci-cron-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Apply database migrations
        run: npx drizzle-kit migrate
      - name: Unit and isolation tests
        run: npm test
      - run: npm run build
